<div>
    <mat-checkbox>
        Subscribe
        </mat-checkbox>
</div>
<div>
    <mat-checkbox labelPosition="before" disabled>
        Subscribe
    </mat-checkbox>
</div>

<section class="example-section">
    <span class="example-list-section">
      <mat-checkbox
        class="example-margin"
        [checked]="task().completed"
        [indeterminate]="partiallyComplete()"
        (change)="update($event.checked)"
      >
        {{task().name}}
      </mat-checkbox>
    </span>
    <span class="example-list-section">
      <ul>
        @for (subtask of task().subtasks; track subtask; let i = $index) {
          <li>
            <mat-checkbox [checked]="subtask.completed" (change)="update($event.checked, i)">
              {{subtask.name}}
            </mat-checkbox>
          </li>
        }
      </ul>
    </span>
  </section>

<mat-radio-group>
  <mat-radio-button value="angular" labelPosition="before">Angular</mat-radio-button>
  <mat-radio-button value="react">React</mat-radio-button>
  <mat-radio-button value="vue">Vue</mat-radio-button>
</mat-radio-group>
