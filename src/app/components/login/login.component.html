<form (ngSubmit)="onLogin()">
    <label for="email">Email</label>
    <input type="email" [(ngModel)]="loginObj.email" name="email" id="email">

    <label for="password">Password</label>
    <input type="password" [(ngModel)]="loginObj.password" name="password" id="password">
    <button type="submit">Login</button>
</form>
